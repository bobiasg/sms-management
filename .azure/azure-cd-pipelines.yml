# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: 'bobiasg/sms-management'

stages: 
- stage: CheckImageExist
  displayName: check image exists in docker hub
  jobs:
  - job: SetDockerImageTag
    displayName: 'Get Git Info'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    steps:
    - checkout: none
    #   fetchDepth: 1      
    #   displayName: 'Checkout repository'

    - script: |
        echo "##[section]Determining image tag"
        SHORT_GIT_HASH=$(git rev-parse --short HEAD)
        IMAGE_TAG="sha-$SHORT_GIT_HASH"
        echo "ImageApp: $(IMAGE_NAME):$IMAGE_TAG"
        echo "##vso[task.setvariable variable=IMAGE_TAG;isOutput=true]$IMAGE_TAG"
      displayName: 'Set Docker Image Tag'
      name: ImageTagInfo
  
  - job: CheckImage  
    displayName: "Check image exists before deploy"
    dependsOn: SetDockerImageTag # Replace with the actual job name that sets IMAGE_TAG
    variables:
      IMAGE_TAG: $[ dependencies.SetDockerImageTag.outputs['ImageTagInfo.IMAGE_TAG'] ]  
    steps:
    - checkout: none
    - task: Docker@2
      inputs:
        containerRegistry: 'DockerHub-Bobiasg'
        command: 'login'
   
    - script: |
        echo "image name: $(IMAGE_NAME), tag: $(IMAGE_TAG)"
        IMAGE_APP="$(IMAGE_NAME):$(IMAGE_TAG)"
        echo "Check $IMAGE_APP exists"

        if docker pull "$IMAGE_APP" &> /dev/null; then
          echo "Docker image $IMAGE_APP exists on Docker Hub."
        else
          echo "Docker image $IMAGE_APP does not exist on Docker Hub."
          echo "##vso[task.setvariable variable=IMAGE_TAG_DOES_NOT_EXIST;isOutput=true]true"
        fi
      name: CheckImageExist    

  - job: BuildImage 
    displayName: "Build image and push to docker hub"
    dependsOn: CheckImage
    condition: eq(dependencies.CheckImage.outputs['CheckImageExist.IMAGE_TAG_DOES_NOT_EXIST'], true)
    variables:
      IMAGE_TAG: $[ dependencies.SetDockerImageTag.outputs['ImageTagInfo.IMAGE_TAG'] ]  
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'DockerHub-Bobiasg'
        repository: 'bobiasg/sms-management'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          "sha-$(IMAGE_TAG)"

- stage: Deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  dependsOn: CheckImageExist
  variables:
      IMAGE_TAG: $[ stageDependencies.CheckImageExist.SetDockerImageTag.outputs['ImageTagInfo.IMAGE_TAG'] ]  
  displayName: 'Dev Deployment'
  jobs:
    - deployment: DeployToStaging
      environment: staging
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebAppContainer@1
                inputs:
                  azureSubscription: 'Azure subscription 1 (a99f60cb-60c3-451b-b209-66fbbbe9f4c6)'
                  appName: 'minicrm-bobiasg-docker2'
                  containers: "$(IMAGE_NAME):$(IMAGE_TAG)"



