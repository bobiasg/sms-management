# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_APP: ''

stages: 
- stage: CheckImageExist
  displayName: check image exists in docker hub
  jobs:
  - job: GetGitInfo
    displayName: 'Get Git Info'
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
    steps:
    # - checkout: self
    #   fetchDepth: 1      
    #   displayName: 'Checkout repository'

    - script: |
        echo "##[section]Determining short Git hash"
        SHORT_GIT_HASH=$(git rev-parse --short HEAD)
        IMAGE_APP="bobiasg/sms-management:sha-$SHORT_GIT_HASH"
        echo "Short Git Hash: $SHORT_GIT_HASH"
        echo "##vso[task.setvariable variable=ShortGitHash]$SHORT_GIT_HASH"
        echo "##vso[task.setvariable variable=IMAGE_APP]$IMAGE_APP"
      displayName: 'Set Docker Image Tag'
  
  - job: CheckImage  
    displayName: "Check image exists before deploy"
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'DockerHub-Bobiasg'
        command: 'login'
   
    - script: |
        echo "Check $(ImageApp) exists"

        if docker pull "$(IMAGE_APP)" &> /dev/null; then
          echo "Docker image $(IMAGE_APP) exists on Docker Hub."
        else
          echo "Docker image $(IMAGE_APP) does not exist on Docker Hub."
          exit 1
        fi
         
- stage: Deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: 'Dev Deployment'
  jobs:
    - deployment: DeployToStaging
      environment: staging
      strategy:
        runOnce:
          deploy:
            steps:
              - task: AzureWebAppContainer@1
                inputs:
                  azureSubscription: 'Azure subscription 1 (a99f60cb-60c3-451b-b209-66fbbbe9f4c6)'
                  appName: 'minicrm-bobiasg-docker2'
                  containers: '$ImageApp'



