  AZURE_WEBAPP_NAME: minicrm-bobiasg-docker    # set this to your application's name
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.outputs.image_name || 'ghcr.io/' + github.repository + ':sha-' + github.sha }}

