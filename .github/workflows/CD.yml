    environment:
      name: 'production'
      url: ${{ steps.deploy-to-container.outputs.webapp-url }}

    steps:

    - name: 'Deploy to Azure WebApp'
      env: 
        image_latest: "${{env.REGISTRY}}/${{env.IMAGE_NAME}}:sha-${{github.sha}}"
        image_name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.outputs.image_name || env.image_latest }}
      id: deploy-to-container
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: ${{ env.image_name}}
