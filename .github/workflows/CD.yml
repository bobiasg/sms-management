  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Log in to GitHub container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: echo  data
      run: |
        echo "from docker workflow: ${{ github.event.workflow_run.outputs.image_name }}"
    - name: Run tests
      run: |
        docker run --name app ${{ env.IMAGE_NAME }} /bin/sh -c "npm run test"
        docker rm app
  
